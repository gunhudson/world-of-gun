<script>
  // Set before first paint: the overlay route is transparent, and the saved skin applies at once.
  (function () {
    var d = document.documentElement, q = location.search, isOverlay = /[?&]overlay=1(&|$)/.test(q);
    if (isOverlay) d.classList.add("overlay");
    else if (!/[?&]stage=stub(&|$)/.test(q)) {
      for (var u of ["/app/stage.js", "/vendor/three/build/three.module.min.js"]) {
        var l = document.createElement("link"); l.rel = "modulepreload"; l.href = u; document.head.appendChild(l);
      }
    }
    try {
      var m = q.match(/[?&]skin=(operative|pandora|azeroth)/), s = m ? m[1] : localStorage.getItem("wog.skin");
      if (s === "pandora" || s === "azeroth") d.setAttribute("data-skin", s);
    } catch (e) {}
  })();
</script>
<script>
  // The world's own name (<meta name="wog-name">, written by the worker from WORLD_NAME) replaces the neutral default in
  // the install title and in the web manifest. Without the tag nothing changes.
  (function () {
    try {
      var m = document.querySelector('meta[name="wog-name"]'), name = m && (m.getAttribute("content") || "").trim();
      if (!name) return;
      document.title = name;
      var at = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (at) at.setAttribute("content", name);
      var link = document.querySelector('link[rel="manifest"]'); if (!link || !window.fetch || !window.URL || !URL.createObjectURL) return;
      fetch(link.getAttribute("href"), { credentials: "same-origin" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
        if (!j) return; j.name = name; j.short_name = name.slice(0, 12);
        j.start_url = location.origin + "/"; j.scope = location.origin + "/"; j.id = location.origin + "/";
        j.icons = (j.icons || []).map(function (i) { return Object.assign({}, i, { src: new URL(i.src, location.origin).href }); });
        link.setAttribute("href", URL.createObjectURL(new Blob([JSON.stringify(j)], { type: "application/manifest+json" })));
      }).catch(function () {});
    } catch (e) {}
  })();
</script>
